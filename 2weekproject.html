<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>


    <style>

        /* ==================== RESET ==================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        /* ==================== BODY ==================== */

        body {

            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            padding: 40px 20px;
        }


        /* ==================== MAIN CONTAINER ==================== */

        .form-container {

            width: 100%;

            max-width: 850px;

            margin: auto;

            background: #ffffff;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.25);
        }


        /* ==================== HEADER ==================== */

        .form-header {

            text-align: center;

            margin-bottom: 30px;
        }


        .form-header h1 {

            color: #4f46e5;

            font-size: 32px;

            margin-bottom: 10px;
        }


        .form-header p {

            color: #666;

            font-size: 15px;
        }


        /* ==================== FORM GRID ==================== */

        .form-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;
        }


        /* ==================== FORM GROUP ==================== */

        .form-group {

            display: flex;

            flex-direction: column;
        }


        /* FULL WIDTH */

        .full {

            grid-column: 1 / -1;
        }


        /* ==================== SECTION TITLE ==================== */

        .section-title {

            grid-column: 1 / -1;

            font-size: 20px;

            font-weight: bold;

            color: #4f46e5;

            padding-bottom: 8px;

            border-bottom: 2px solid #eeeeee;
        }


        /* ==================== LABEL ==================== */

        label {

            color: #333;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 7px;
        }


        /* ==================== INPUT & SELECT ==================== */

        input,
        select {

            width: 100%;

            padding: 12px;

            border: 2px solid #e5e7eb;

            border-radius: 10px;

            background: #f9fafb;

            font-size: 15px;

            color: #333;

            outline: none;

            transition: 0.3s;
        }


        /* ==================== FOCUS ==================== */

        input:focus,
        select:focus {

            border-color: #6366f1;

            background: #ffffff;

            box-shadow:
                0 0 0 3px rgba(99, 102, 241, 0.12);
        }


        /* ==================== FILE INPUT ==================== */

        input[type="file"] {

            padding: 9px;

            cursor: pointer;
        }


        /* ==================== CHECKBOX & RADIO ==================== */

        .option-box {

            display: flex;

            align-items: center;

            gap: 20px;

            min-height: 45px;
        }


        .option-box label {

            display: flex;

            align-items: center;

            gap: 6px;

            margin: 0;

            font-weight: normal;

            cursor: pointer;
        }


        .option-box input[type="checkbox"],
        .option-box input[type="radio"] {

            width: auto;

            accent-color: #6366f1;
        }


        /* ==================== DATE & TIME ==================== */

        input[type="datetime-local"] {

            min-height: 45px;
        }


        /* ==================== BUTTON AREA ==================== */

        .buttons {

            grid-column: 1 / -1;

            display: flex;

            justify-content: center;

            gap: 15px;

            margin-top: 15px;
        }


        /* ==================== BUTTONS ==================== */

        .buttons input {

            width: 140px;

            border: none;

            color: white;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        /* SUBMIT BUTTON */

        .submit-btn {

            background: linear-gradient(
                135deg,
                #6366f1,
                #8b5cf6
            );
        }


        /* RESET BUTTON */

        .reset-btn {

            background: #64748b;
        }


        /* BUTTON HOVER */

        .buttons input:hover {

            transform: translateY(-3px);

            box-shadow:
                0 8px 18px rgba(0, 0, 0, 0.2);
        }


        /* ==================== MOBILE ==================== */

        @media (max-width: 650px) {

            body {

                padding: 20px 10px;
            }


            .form-container {

                padding: 25px 18px;
            }


            .form-grid {

                grid-template-columns: 1fr;
            }


            .full,
            .section-title,
            .buttons {

                grid-column: auto;
            }


            .buttons {

                flex-direction: column;
            }


            .buttons input {

                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- ==================== MAIN CONTAINER ==================== -->

    <div class="form-container">


        <!-- ==================== HEADER ==================== -->

        <div class="form-header">

            <h1>Registration Form</h1>

            <p>
                Please fill in your details carefully
            </p>

        </div>



        <!-- ==================== FORM ==================== -->

        <form
            name="regfrm"
            action="p11.html"
            method="GET"
        >


            <div class="form-grid">


                <!-- ==================== SECTION ==================== -->

                <div class="section-title">

                    Personal Information

                </div>



                <!-- ==================== FIRST NAME ==================== -->

                <div class="form-group">

                    <label for="firstname">

                        First Name

                    </label>


                    <input
                        type="text"
                        id="firstname"
                        name="firstname"
                        placeholder="Enter first name"
                    >

                </div>



                <!-- ==================== LAST NAME ==================== -->

                <div class="form-group">

                    <label for="lastname">

                        Last Name

                    </label>


                    <input
                        type="text"
                        id="lastname"
                        name="lastname"
                        placeholder="Enter last name"
                    >

                </div>



                <!-- ==================== USERNAME ==================== -->

                <div class="form-group">

                    <label for="username">

                        Username

                    </label>


                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                    >

                </div>



                <!-- ==================== PASSWORD ==================== -->

                <div class="form-group">

                    <label for="password">

                        Password

                    </label>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                    >

                </div>



                <!-- ==================== CONTACT ==================== -->

                <div class="form-group">

                    <label for="contact">

                        Contact Number

                    </label>


                    <input
                        type="tel"
                        id="contact"
                        name="contact"
                        placeholder="Enter phone number"
                    >

                </div>



                <!-- ==================== EMAIL ==================== -->

                <div class="form-group">

                    <label for="email">

                        Email Address

                    </label>


                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter email"
                    >

                </div>



                <!-- ==================== CERTIFICATE ==================== -->

                <div class="form-group full">

                    <label for="certificate">

                        Upload Certificate

                    </label>


                    <input
                        type="file"
                        id="certificate"
                        name="certificate"
                        multiple
                    >

                </div>



                <!-- ==================== EXPERIENCE ==================== -->

                <div class="form-group">

                    <label for="experience">

                        Job Experience

                    </label>


                    <input
                        type="number"
                        id="experience"
                        name="experience"
                        min="0"
                        max="10"
                        step="0.5"
                        placeholder="Years"
                    >

                </div>



                <!-- ==================== SKILLS ==================== -->

                <div class="form-group">

                    <label>

                        Skills

                    </label>


                    <div class="option-box">


                        <label>

                            <input
                                type="checkbox"
                                name="skills"
                                value="HTML"
                            >

                            HTML

                        </label>


                        <label>

                            <input
                                type="checkbox"
                                name="skills"
                                value="CSS"
                            >

                            CSS

                        </label>


                        <label>

                            <input
                                type="checkbox"
                                name="skills"
                                value="JavaScript"
                            >

                            JavaScript

                        </label>


                    </div>

                </div>



                <!-- ==================== GENDER ==================== -->

                <div class="form-group">

                    <label>

                        Gender

                    </label>


                    <div class="option-box">


                        <label>

                            <input
                                type="radio"
                                name="gender"
                                value="male"
                            >

                            Male

                        </label>


                        <label>

                            <input
                                type="radio"
                                name="gender"
                                value="female"
                            >

                            Female

                        </label>


                    </div>

                </div>



                <!-- ==================== DATE & TIME ==================== -->

                <div class="form-group">

                    <label for="datetime">

                        Date & Time

                    </label>


                    <input
                        type="datetime-local"
                        id="datetime"
                        name="datetime"
                    >

                </div>



                <!-- ==================== COURSE ==================== -->

                <div class="form-group">

                    <label for="course">

                        Select Course

                    </label>


                    <select
                        id="course"
                        name="course"
                    >

                        <option value="">

                            Select an option

                        </option>


                        <option value="HTML">

                            HTML

                        </option>


                        <option value="CSS">

                            CSS

                        </option>


                        <option value="JAVA">

                            Java

                        </option>


                        <option value="WD">

                            Web Development

                        </option>


                    </select>

                </div>



                <!-- ==================== TECHNOLOGY ==================== -->

                <div class="form-group">

                    <label for="technology">

                        Select Technology

                    </label>


                    <select
                        id="technology"
                        name="technology"
                    >

                        <option value="">

                            Select an option

                        </option>


                        <option value="Autodesk Inventor">

                            Autodesk Inventor

                        </option>


                        <option value="MATLAB">

                            MATLAB

                        </option>


                        <option value="ANSYS">

                            ANSYS

                        </option>


                        <option value="Embedded C">

                            Embedded C

                        </option>


                        <option value="ROS">

                            Robot Operating System (ROS)

                        </option>


                        <option value="Python">

                            Python

                        </option>


                        <option value="C">

                            C

                        </option>


                        <option value="C++">

                            C++

                        </option>


                        <option value="HTML">

                            HTML

                        </option>


                        <option value="CSS">

                            CSS

                        </option>


                        <option value="JavaScript">

                            JavaScript

                        </option>


                        <option value="SQL">

                            SQL

                        </option>


                        <option value="Git">

                            Git

                        </option>


                        <option value="GitHub">

                            GitHub

                        </option>


                        <option value="Arduino">

                            Arduino

                        </option>


                        <option value="Raspberry Pi">

                            Raspberry Pi

                        </option>


                        <option value="Other">

                            Other

                        </option>


                    </select>

                </div>



                <!-- ==================== HIDDEN FIELD ==================== -->

                <input
                    type="hidden"
                    name="language"
                    value="English"
                >



                <!-- ==================== BUTTONS ==================== -->

                <div class="buttons">


                    <input
                        type="submit"
                        value="Submit"
                        class="submit-btn"
                    >


                    <input
                        type="reset"
                        value="Reset"
                        class="reset-btn"
                    >


                </div>


            </div>

        </form>

    </div>


</body>

</html>
